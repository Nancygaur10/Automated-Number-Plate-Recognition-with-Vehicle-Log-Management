{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUARD LOGIN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>
<body>
    <div class="main-wrapper">
    <form method="post">
        {% csrf_token %}
        <div class="container" >
            <img src="{% static 'media/logo.png' %}"  class="logo-img" alt="">
            <h2>GUARD LOGIN</h2>
            <p class="text-muted">SECURE SOCIETY ACCESS</p>

            <div class="input-box">
                <i class="fa-regular fa-user"></i>
                <input type="text" placeholder="Full Name" name="username">
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" placeholder="Password" name="password">
            </div>

            <button class="create-btn w-100">Log In</button>

            <div class="login-link">
                <a href="{% url 'home' %}"> <i class="fa-solid fa-arrow-left-long"></i> Back To Home</a>
            </div>
        </div>

    </form>


<!-- Pop up of error when credentials not matched  -->
{% if error %}
<script>
    alert("{{ error|escapejs }}")
</script>
{% endif %}


</div>
</body>
</html>
