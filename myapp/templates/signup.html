{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN UP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="main-wrapper">
    <form action="" method="post">
         {% csrf_token %}   
        <div class="container" >
            <img src="{% static 'media/logo.png' %}"  class="logo-img" alt="">
            <h2>SignUp Portal</h2>
            <p class="text-muted">SECURE SOCIETY ACCESS</p>

        <div class="btn-group custom-toggle w-100 mb-3" role="group" aria-label="Basic radio toggle button group">
            <input type="radio" class="btn-check" name="role" id="admin" value="admin" autocomplete="off" checked="">
            <label class="btn" for="admin">Admin</label>
            
            <input type="radio" class="btn-check" name="role" id="guard" value="guard" autocomplete="off">
            <label class="btn" for="guard">Guard</label>
        </div>

        <div class="input-box">
            <i class="fa-regular fa-user"></i>
            <input type="text" placeholder="Full Name" name="username">
        </div>

        <div class="input-box">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" placeholder="Email Address" name="email">
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Password" name="password">
        </div>

        <div class="input-box">
            <i class="fa-solid fa-lock"></i>
            <input type="password" placeholder="Confirm Password" name="confirm_password">
        </div>

        <button class="create-btn w-100">Sign Up</button>

        <div class="login-link">
            Already have an account? <a href="{% url 'home' %}">Log In</a>
        </div>
    </div>
</form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>

{% if error %}
    <script>
        alert("{{ error|escapejs }}");
    </script>
{% endif %}



{% if success %}
    <script>
        alert("{{ success }}");
    </script>
{% endif %}

</div>

</body>
</html>
